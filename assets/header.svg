<!-- title -->
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
  <text x="600" y="170" font-size="96" font-weight="800" letter-spacing="20" fill="url(#gold)" opacity="0">AHMII LABS
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" dur="1.4s" fill="freeze"/>
  </text>
  <text x="600" y="214" font-size="18" letter-spacing="9" fill="#d8cba8">IDEAS  ×  CODE  ×  AI  ×  WEB</text>
</g>

<g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#f5d98b">
<text x="600" y="262" opacity="0">We build websites that feel premium<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 -8;0 -8" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
<text x="600" y="262" opacity="0">We build AI that works for you<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 -8;0 -8" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
<text x="600" y="262" opacity="0">We build software that scales<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 -8;0 -8" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
<text x="600" y="262" opacity="0">We build automation that runs itself<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 -8;0 -8" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
</g>
<text x="600" y="306" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="8" text-anchor="middle" fill="#8f7a45">INNOVATE  •  DEVELOP  •  EMPOWER</text>
</svg>