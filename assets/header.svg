<g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#f5d98b">
<text x="600" y="276" opacity="0">We build websites that feel premium<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 -8;0 -8" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
<text x="600" y="276" opacity="0">We build AI that works for you<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 -8;0 -8" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
<text x="600" y="276" opacity="0">We build software that scales<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 -8;0 -8" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
<text x="600" y="276" opacity="0">We build games and 3D worlds in the browser<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 -8;0 -8" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
</g><text x="600" y="322" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="8" text-anchor="middle" fill="#8f7a45">INNOVATE  •  DEVELOP  •  EMPOWER</text></svg>