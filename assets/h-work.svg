<text x="600" y="28" font-size="13" letter-spacing="8" fill="#8f7a45">03 — PORTFOLIO</text>
<text x="600" y="78" font-size="46" font-weight="800" letter-spacing="8" fill="url(#gold)">SELECTED WORK</text></g>
<rect x="600" y="96" width="0" height="2" rx="1" fill="#f5d98b"><animate attributeName="x" values="600;520;600" dur="4s" repeatCount="indefinite"/><animate attributeName="width" values="0;160;0" dur="4s" repeatCount="indefinite"/></rect>
