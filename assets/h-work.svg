<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="Selected Work">
<defs><linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#8a6a2b"/><stop offset="0.5" stop-color="#fff0b8"/><stop offset="1" stop-color="#8a6a2b"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1200 0" to="0 0" dur="6s" repeatCount="indefinite"/></linearGradient></defs>
