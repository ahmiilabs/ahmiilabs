<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Process: Idea, Design, Build, Ship"><defs><radialGradient id="d"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#f5d98b" stop-opacity="0"/></radialGradient></defs>
<line x1="150" y1="80" x2="1050" y2="80" stroke="#3a2f16" stroke-width="2" stroke-dasharray="6 8"/>
