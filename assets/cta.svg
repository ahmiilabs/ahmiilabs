<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Have an idea? Let’s build it. Start a project.">
<defs><linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#8a6a2b"/><stop offset="0.5" stop-color="#fff0b8"/><stop offset="1" stop-color="#8a6a2b"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1200 0" to="0 0" dur="6s" repeatCount="indefinite"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#c9a24b" stop-opacity="0.25"/><stop offset="1" stop-color="#070605" stop-opacity="0"/></radialGradient></defs>
<rect x="2" y="2" width="1196" height="236" rx="22" fill="#0b0a08" stroke="#3a2f16" stroke-width="2"/>
<rect x="2" y="2" width="1196" height="236" rx="22" fill="url(#glow)"><animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/></rect>
<rect x="2" y="2" width="1196" height="236" rx="22" fill="none" stroke="#f5d98b" stroke-width="2.5" pathLength="100" stroke-dasharray="10 90" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="100;0" dur="8s" repeatCount="indefinite"/></rect>
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
<text x="600" y="92" font-size="48" font-weight="800" fill="url(#gold)">Have an idea? Let’s build it.</text>
<text x="600" y="128" font-size="17" letter-spacing="3" fill="#d8cba8">WEB  ·  AI  ·  SOFTWARE  —  WE REPLY FAST</text>
<g><rect x="450" y="154" width="300" height="52" rx="26" fill="#f5d98b"><animate attributeName="opacity" values="1;0.8;1" dur="2.4s" repeatCount="indefinite"/></rect>
<text x="600" y="187" font-size="17" font-weight="800" letter-spacing="4" fill="#070605">START A PROJECT  ↗</text></g></g></svg>